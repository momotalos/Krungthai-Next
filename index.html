function Ring({ score, size = 64, stroke = 7 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const col = score >= 70 ? T.good : score >= 45 ? T.warn : T.bad;
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={T.line} strokeWidth={stroke} />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={col} strokeWidth={stroke}
        strokeLinecap="round" strokeDasharray={`${(score / 100) * c} ${c}`}
        style={{ transition: "stroke-dasharray .6s ease" }} />
    </svg>
  );
}

// ===== ANALYSIS FUNCTION =====
function analyze(a) {
  const occ = OCCUPATIONS.find((o) => o.id === a.occupation) || OCCUPATIONS[2];
  let efMonthsNeeded = occ.months;
  if (a.incomeType !== "Fixed Income") efMonthsNeeded = Math.min(12, efMonthsNeeded + 3);
  const efHave = EF_STATUS.find((s) => s.id === a.efStatus)?.months ?? 0;
  const efScore = Math.min(95, Math.round((efHave / efMonthsNeeded) * 100));

  const invBase = a.investStatus === "regular" ? 75 : a.investStatus === "some" ? 50 : 25;
  const invScore = Math.min(90, invBase + (a.investTypes.length >= 2 ? 10 : 0));

  const insCount = a.insurance.filter((i) => i !== "ไม่มี" && i !== "Others").length;
  let insScore = a.insurance.includes("ไม่มี") || insCount === 0 ? 20 : 30 + insCount * 20;
  if (a.hasDebt && a.debtTypes.includes("Home Loan") && !a.insurance.includes("Life Insurance"))
    insScore = Math.min(insScore, 55);
  insScore = Math.min(90, insScore);

  const dti = a.hasDebt && a.income > 0 ? (a.debtPayment / a.income) * 100 : 0;
  const spendScore = !a.hasDebt ? 78 : dti < 20 ? 68 : dti < 40 ? 48 : 28;

  const annual = a.income * 12;
  const taxable = annual > 310000;
  const taxScore = !taxable ? 75 : 55;

  const goalsScore = a.goals.length === 0 ? 30 : Math.min(85, 45 + a.goals.length * 10);

  const expense = a.expense || Math.round(a.income * 0.65);
  const overall = Math.round((efScore + invScore + insScore + spendScore + taxScore + goalsScore) / 6);
  return { occ, efMonthsNeeded, efHave, efScore, invScore, insScore, spendScore, taxScore, goalsScore, dti, taxable, annual, expense, overall };
}

// ===== ONBOARDING (FULL) =====

    a.efStatus && a.investStatus && a.insurance.length > 0,

    true,
    a.risk && a.wealthPref && a.lifestyle.length > 0,

              💡 ข้อมูลพื้นฐาน ที่ระบบใช้เทียบกับโปรไฟล์บัญชี

            <Field label={t("ค่าใช้จ่ายต่อเดือน (บาท)","Monthly Expense (THB)")}>
              <input style={inputStyle} type="number" value={a.expense || ""} placeholder="15000"
                onChange={(e) => set({ expense: +e.target.value || 0 })} />
            </Field>
            <Field label={t("ประเภทรายได้","Income Type")}>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {INCOME_TYPES.map((t) => (
                  <Chip key={t} active={a.incomeType === t} onClick={() => set({ incomeType: t })}>{t}</Chip>

        {step === 1 && (

// ===== INVESTMENT PAGE (AI-Powered — Gemini via Netlify Functions) =====
// Auto-fallback: if one model hits quota, tries the next model automatically.
// Models ordered by free-tier quota: highest RPD & RPM first
// Tier 1: 500 RPD / 15 RPM (best)
// Tier 2: 20 RPD / 10 RPM
// Tier 3: 20 RPD / 5 RPM
const GEMINI_MODELS = [
  "gemini-3.5-flash-lite",   // 15 RPM, 250K tokens, 500 RPD ★ best
  "gemini-3.1-flash-lite",   // 15 RPM, 250K tokens, 500 RPD
  "gemini-2.5-flash-lite",   // 10 RPM, 250K tokens, 20 RPD
  "gemini-3.6-flash",        //  5 RPM, 250K tokens, 20 RPD (newest)
  "gemini-3.5-flash",        //  5 RPM, 250K tokens, 20 RPD
  "gemini-3-flash",          //  5 RPM, 250K tokens, 20 RPD
  "gemini-2.5-flash",        //  5 RPM, 250K tokens, 20 RPD
];

async function callGemini({ systemInstruction, contents, temperature, maxOutputTokens }) {
  let lastError = "";
  for (const model of GEMINI_MODELS) {
    try {
      const resp = await fetch("/.netlify/functions/gemini-proxy", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model, systemInstruction, contents, temperature: temperature || 0.7, maxOutputTokens: maxOutputTokens || 1024 }),
      });
      const data = await resp.json();
      if (resp.ok && data.text) return data.text;
      // If quota error, try next model
      const errMsg = data.error || "";
      if (errMsg.includes("quota") || errMsg.includes("429") || errMsg.includes("rate") || errMsg.includes("limit") || errMsg.includes("exceeded") || resp.status === 429) {
        lastError = model + " quota exceeded";
        continue;
      }
      // Other errors — still try next model
      lastError = errMsg || "Unknown error from " + model;
    } catch (e) {
      lastError = e.message;
    }
  }
  throw new Error("ทุก model ถูกใช้เกิน quota แล้ว กรุณารอสักครู่แล้วลองใหม่ (" + lastError + ")");
}

// ===== SMART WEALTH ALLOCATION (Step 2) =====
// Profile-driven engine: reads ALL assessment answers and predicts
// the person's priorities + income allocation + insights.
function buildPlan(a, A) {
  const income = a.income || 0;
  const deps = a.dependents || 0;
  const dt = a.debtTypes || [];
  const variableIncome = a.incomeType && a.incomeType !== "Fixed Income";
  const growthMinded = ["Wealth Growth", "Passive Income", "Financial Freedom"].includes(a.wealthPref);

  const goalObjs = (a.goals || [])
    .map((gid) => ({ g: GOALS.find((x) => x.id === gid), d: a.goalDetails[gid] || {} }))
    .filter((x) => x.g);
  const goalsByHorizon = [...goalObjs].sort((x, y) => (x.d.years || 99) - (y.d.years || 99));

  // ---------- URGENCY-RANKED PRIORITIES ----------
  const cand = [];

  // Emergency Fund
  let efU = 100 - A.efScore;
  if (variableIncome) efU += 10;
  if (deps > 0) efU += 5;
  cand.push({ label: A.efScore < 70 ? "Build Emergency Fund" : "Maintain Emergency Fund", urgency: efU });

  // Debt payoff (only if in debt)
  if (a.hasDebt) {
    let dU = A.dti >= 40 ? 92 : A.dti >= 20 ? 68 : 46;
    const highInterest = dt.includes("Credit Card");
    if (highInterest) dU += 15;
    cand.push({ label: highInterest ? "Pay Down High-Interest Debt" : "Reduce Debt Burden", urgency: dU });
  }

  // Goals (each, urgency from horizon + priority flag)
  goalObjs.forEach((go) => {
    const yrs = go.d.years || 99;
    let gU = yrs < 1 ? 84 : yrs <= 3 ? 68 : yrs <= 5 ? 54 : 40;
    if (go.d.priority === "High") gU += 10;
    else if (go.d.priority === "Low") gU -= 8;
    cand.push({ label: `Save for ${go.g.label} Fund`, urgency: gU, yrs });
  });

  // Investment (dampened if foundation weak)
  let invU = A.invScore < 50 ? 56 : 46;
  if (A.efScore < 50) invU -= 18;
  if (a.risk === "aggressive") invU += 12;
  else if (a.risk === "moderate") invU += 6;
  if (growthMinded) invU += 8;
  cand.push({ label: "Grow Investment Portfolio", urgency: invU });

  // Insurance / Protection
  let insU = 80 - A.insScore;
  if (deps > 0) insU += 15;
  if (a.maritalStatus === "Married") insU += 5;
  if (a.hasDebt && dt.includes("Home Loan") && !a.insurance.includes("Life Insurance")) insU += 15;
  cand.push({ label: "Build Financial Protection", urgency: insU });

  // Tax
  let taxU = A.annual > 750000 ? 66 : A.annual > 310000 ? 52 : 24;
  cand.push({ label: A.taxable ? "Optimize Tax Planning" : "Start Tax Planning", urgency: taxU });

  const priorities = cand
    .sort((x, y) => y.urgency - x.urgency || (x.yrs || 0) - (y.yrs || 0))
    .map((p) => ({ label: p.label, band: p.urgency >= 70 ? T.bad : p.urgency >= 45 ? T.warn : T.good }));

  // ---------- ALLOCATION (% of monthly income) ----------
  let emergency = A.efScore < 30 ? 22 : A.efScore < 60 ? 17 : A.efScore < 80 ? 12 : 6;
  if (variableIncome) emergency += 3;

  // Goals — derived from ACTUAL required monthly saving across their goals
  let goalNeed = 0;
  goalObjs.forEach((go) => { if (go.d.amount && go.d.years) goalNeed += go.d.amount / (go.d.years * 12); });
  let goals = 0;
  if (goalObjs.length > 0) {
    goals = income > 0 ? Math.min(28, (goalNeed / income) * 100) : 18;
    goals = Math.max(8, goals);
  }

  let investment = a.risk === "aggressive" ? 16 : a.risk === "conservative" ? 8 : 12;
  if (A.efScore < 50) investment = investment * 0.6;
  if (growthMinded) investment += 3;

  let insurance = A.insScore < 40 ? 9 : A.insScore < 70 ? 6 : 4;
  if (deps > 0) insurance += 2;
  if (a.hasDebt && dt.includes("Home Loan") && !a.insurance.includes("Life Insurance")) insurance += 2;

  let tax = A.annual > 750000 ? 8 : A.taxable ? 6 : 2;

  // Debt-service pressure pulls from discretionary buckets
  if (a.hasDebt && A.dti >= 30) {
    investment = Math.max(4, investment - 4);
    goals = goalObjs.length ? Math.max(6, goals - 3) : 0;
  }

  emergency = Math.round(emergency);
  goals = Math.round(goals);
  investment = Math.round(investment);
  insurance = Math.round(insurance);
  tax = Math.round(tax);

  let others = emergency + goals + investment + insurance + tax;
  let daily = 100 - others;
  if (daily < 30) {
    let over = 30 - daily;
    const trimG = Math.min(goals, over); goals -= trimG; over -= trimG;
    investment = Math.max(0, investment - over);
    daily = 30;
  }
  const alloc = { daily, emergency, goals, investment, insurance, tax };

  // ---------- INSIGHTS ----------
  const insights = [];
  if (A.efScore < 60) insights.push("ยังไม่มี Financial Foundation จาก Emergency Fund");
  else insights.push("มี Emergency Fund เป็น Financial Foundation ที่มั่นคงแล้ว");
  if (a.hasDebt && A.dti >= 30) insights.push(`ภาระหนี้ค่อนข้างสูง (DTI ${A.dti.toFixed(0)}%) ควรเร่งลดหนี้ก่อนขยายการลงทุน`);
  if (goalObjs.length >= 2) insights.push("มี Financial Goals หลายเป้าหมายที่ต้องบริหารพร้อมกัน");
  else if (goalObjs.length === 1) insights.push("มี Financial Goal ที่ชัดเจน 1 เป้าหมาย");
  if (goalsByHorizon.length >= 2) insights.push(`${goalsByHorizon[0].g.label} เป็น Goal ที่มี Time Horizon สั้นกว่า ${goalsByHorizon[goalsByHorizon.length - 1].g.label}`);
  const riskLabel = a.risk === "aggressive" ? "High" : a.risk === "conservative" ? "Conservative" : "Moderate";
  insights.push(`สามารถเริ่มสร้าง Wealth ผ่านการลงทุนได้ในระดับ ${riskLabel} Risk`);
  if (deps > 0) insights.push(`มีผู้พึ่งพา ${deps} คน — Financial Protection สำคัญกว่าคนทั่วไป`);
  if (A.insScore < 50) insights.push("ยังขาด Financial Protection ที่เพียงพอ");
  else insights.push("มี Financial Protection ในระดับที่เหมาะสม");
  if (A.taxable) insights.push("รายได้ถึงเกณฑ์เสียภาษี ควรวางแผนลดหย่อนอย่างจริงจัง");
  else insights.push("Tax Planning ยังไม่ใช่ Financial Priority ในปัจจุบัน แต่จะสำคัญมากขึ้นเมื่อรายได้เติบโต");

  return { priorities, alloc, insights };
}

        <Card style={{ padding: 8, overflow: "hidden" }}>
          <TreeSVG answers={answers} />
        </Card>

        <Card>
          <div style={{ fontWeight: 700, color: T.navy, marginBottom: 12 }}>🌳 {t("สุขภาพต้นไม้การเงิน","Financial Tree Health")}</div>
          {parts.map((s) => (
            <div key={s.label} style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
                <span style={{ color: T.sub }}>{s.emoji} {s.label} — {s.desc}</span>
                <b style={{ color: s.score >= 70 ? T.good : s.score >= 45 ? T.warn : T.bad }}>{s.score}/100</b>
              </div>
              <div style={{ height: 7, borderRadius: 4, background: T.line, overflow: "hidden" }}>
                <div style={{ width: `${s.score}%`, height: "100%", borderRadius: 4, background: s.score >= 70 ? T.good : s.score >= 45 ? T.warn : T.bad, transition: "width .6s" }} />
              </div>
            </div>
          ))}
          <div style={{ marginTop: 8, background: T.bg, borderRadius: 8, padding: 10, fontSize: 12, color: T.ink, lineHeight: 1.7 }}>
            {treeStage === "seedling" && t("🌱 ต้นไม้เพิ่งเริ่มเติบโต — สร้างรากฐาน (Emergency Fund) ให้แข็งแรงก่อน","🌱 Your tree is just sprouting — build a strong foundation (Emergency Fund) first.")}
            {treeStage === "growing" && t("🌿 ต้นไม้กำลังเติบโต — ลำต้นเริ่มแข็งแรง ขยายกิ่งก้านต่อได้","🌿 Your tree is growing — the trunk is getting stronger, keep expanding.")}
            {treeStage === "flourishing" && t("🌳 ต้นไม้เติบโตสมบูรณ์! — รากแข็งแรง ลำต้นมั่นคง กิ่งก้านเต็มเป้าหมาย","🌳 Your tree is flourishing! — strong roots, solid trunk, branches full of goals.")}
          </div>
        </Card>

        <Card style={{ background: "linear-gradient(135deg, #FFF8E1, #FFF3CD)" }} onClick={onRewards}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
            <div>
              <div style={{ fontWeight: 700, color: T.navy, fontSize: 13 }}>⭐ {t("คะแนนสะสม","Reward Points")}</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: "#FFB800" }}>{fmt(points)} pts</div>
            </div>
            <div style={{ background: "#FFB800", color: "#fff", padding: "8px 14px", borderRadius: 10, fontSize: 13, fontWeight: 700 }}>{t("แลกรางวัล","Redeem")} →</div>
          </div>
        </Card>
      </div>
    </div>
  );
}

// ===== REWARDS PAGE =====
function RewardsPage({ answers, onBack }) {
  const A = analyze(answers);
  let points = 0;
  if (A.efScore >= 70) points += 200; else if (A.efScore >= 40) points += 80;
  if (A.insScore >= 70) points += 150; else if (A.insScore >= 40) points += 60;
  if (A.spendScore >= 60) points += 100;
  if (A.invScore >= 60) points += 150;
  if (A.goalsScore >= 60) points += 120;
  if (A.taxScore >= 60) points += 80;
  points += Math.floor((answers.income || 0) / 100);

  const [redeemed, setRedeemed] = React.useState([]);

  const lifestyleRewards = [
    { id: "fit", name: "Fitness Discount", desc: "ส่วนลด 20% ค่าสมาชิก Fitness", pts: 200, icon: "💪" },
    { id: "food", name: "Delivery App Discount", desc: "คูปอง ฿50 แอปเดลิเวอรี่", pts: 150, icon: "🍔" },
    { id: "cafe", name: "Café Voucher", desc: "เครื่องดื่มฟรี 1 แก้ว", pts: 100, icon: "☕" },
    { id: "concert", name: "Concert Ticket Discount", desc: "ส่วนลด 15% ตั๋วคอนเสิร์ต", pts: 500, icon: "🎵" },
    { id: "ai", name: "AI Tools Credit", desc: "เครดิต AI Tools มูลค่า ฿200", pts: 300, icon: "🤖" },
    { id: "cowork", name: "Co-Working Day Pass", desc: "ใช้งาน Co-Working Space 1 วัน", pts: 250, icon: "💻" },
    { id: "travel", name: "Travel Discount", desc: "ส่วนลด 10% โรงแรม/ตั๋วเครื่องบิน", pts: 400, icon: "✈️" },
  ];

  const financialRewards = [
    { id: "ins_disc", name: "ส่วนลดเบี้ยประกัน", desc: "ลด 5% เบี้ยประกันผลิตภัณฑ์ที่ร่วมรายการ", pts: 300, icon: "🛡️" },
    { id: "cashback", name: "Cash Back", desc: "เงินคืน ฿100 เข้าบัญชี", pts: 250, icon: "💰" },
    { id: "fund_disc", name: "ลดค่าธรรมเนียมกองทุน", desc: "ลดค่าธรรมเนียมซื้อกองทุน 50%", pts: 350, icon: "📈" },
    { id: "event", name: "Wealth Events Access", desc: "สิทธิ์เข้าร่วม Investment Workshop", pts: 200, icon: "🎓" },
    { id: "content", name: "Exclusive Financial Content", desc: "เข้าถึงบทวิเคราะห์พรีเมียม 30 วัน", pts: 150, icon: "📊" },
  ];

  const usedPts = redeemed.reduce((sum, r) => sum + (r.pts || 0), 0);
  const remaining = points - usedPts;

  function redeem(reward) {
    if (remaining >= reward.pts && !redeemed.find((r) => r.id === reward.id)) {
      setRedeemed([...redeemed, reward]);
    }
  }

  function RewardCard({ r }) {
    const isRedeemed = redeemed.find((x) => x.id === r.id);
    const canAfford = remaining >= r.pts;
    return (
      <div style={{
        display: "flex", gap: 10, alignItems: "center", padding: 12, background: isRedeemed ? "#EAF9F0" : "#fff",
        borderRadius: 12, border: `1px solid ${isRedeemed ? T.good : T.line}`, marginBottom: 8,
      }}>
        <span style={{ fontSize: 28 }}>{r.icon}</span>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, fontSize: 13, color: T.navy }}>{r.name}</div>
          <div style={{ fontSize: 11, color: T.sub }}>{r.desc}</div>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#FFB800", marginTop: 2 }}>⭐ {r.pts} pts</div>
        </div>
        {isRedeemed ? (
          <span style={{ fontSize: 11, fontWeight: 700, color: T.good, padding: "4px 10px", background: "#E0F5E9", borderRadius: 8 }}>✅ {t("แลกแล้ว","Redeemed")}</span>
        ) : (
          <button disabled={!canAfford} onClick={() => redeem(r)} style={{
            padding: "6px 12px", borderRadius: 8, border: "none", fontSize: 11, fontWeight: 700,
            background: canAfford ? "#FFB800" : T.line, color: canAfford ? "#fff" : T.sub,
            cursor: canAfford ? "pointer" : "not-allowed", fontFamily: "inherit",
          }}>{t("แลก","Redeem")}</button>
        )}
      </div>
    );
  }

  return (
    <div className="app-container">
      <Header title={t("รางวัล","Rewards")} sub={t("แลกคะแนนเป็นสิทธิพิเศษ","Redeem points for perks")} onBack={onBack} />
      <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>

        <Card style={{ background: "linear-gradient(135deg, #FFF8E1, #FFF3CD)", textAlign: "center" }}>
          <div style={{ fontSize: 12, color: T.sub }}>{t("คะแนนคงเหลือ","Points balance")}</div>
          <div style={{ fontSize: 36, fontWeight: 800, color: "#FFB800" }}>⭐ {fmt(remaining)}</div>
          <div style={{ fontSize: 11, color: T.sub }}>จากทั้งหมด {fmt(points)} pts (ใช้ไป {fmt(usedPts)} pts)</div>
        </Card>

        <div>
          <div style={{ fontWeight: 700, color: T.navy, marginBottom: 10, fontSize: 15 }}>🛍️ {t("รางวัลไลฟ์สไตล์","Lifestyle Rewards")}</div>
          {lifestyleRewards.map((r) => <RewardCard key={r.id} r={r} />)}
        </div>

        <div>
          <div style={{ fontWeight: 700, color: T.navy, marginBottom: 10, fontSize: 15 }}>💼 {t("รางวัลการเงิน","Financial Rewards")}</div>
          {financialRewards.map((r) => <RewardCard key={r.id} r={r} />)}
        </div>
      </div>
    </div>
  );
}

// ===== DASHBOARD =====
function Dashboard({ answers, go, onEdit, onRewards, onTree }) {
  const A = analyze(answers);
  const pillars = [
    { id: "emergency", en: "Emergency Fund", th: "เงินสำรองฉุกเฉิน", icon: "🛟", score: A.efScore },
    { id: "tax", en: "Tax Planning", th: "วางแผนภาษี", icon: "🧾", score: A.taxScore },
    { id: "spending", en: "Daily Spending", th: "การใช้จ่าย", icon: "💳", score: A.spendScore },
    { id: "goals", en: "Saving Goals", th: "เป้าหมายการออม", icon: "🎯", score: A.goalsScore },
    { id: "invest", en: "Investment", th: "การลงทุน", icon: "📈", score: A.invScore },
    { id: "insurance", en: "Insurance", th: "ประกัน", icon: "🛡️", score: A.insScore },
  ];

  let points = 0;
  if (A.efScore >= 70) points += 200; else if (A.efScore >= 40) points += 80;
  if (A.insScore >= 70) points += 150; else if (A.insScore >= 40) points += 60;
  if (A.spendScore >= 60) points += 100;
  if (A.invScore >= 60) points += 150;
  if (A.goalsScore >= 60) points += 120;
  if (A.taxScore >= 60) points += 80;
  points += Math.floor((answers.income || 0) / 100);

  return (
    <div className="app-container">
      <Header title={t("6 เสาหลักการเงิน","6 Financial Pillars")} sub={`${A.occ.label} · ${fmt(answers.income)} ${t("บาท/เดือน","THB/mo")}`}>
        <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
          <button onClick={onEdit} style={{ background: "rgba(255,255,255,.18)", color: "#fff", border: "none", borderRadius: 8, padding: "5px 12px", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>✏️ {t("แก้ไข","Edit")}</button>
          <button onClick={onRewards} style={{ background: "#FFB800", color: "#fff", border: "none", borderRadius: 8, padding: "5px 12px", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>⭐ {fmt(points)} pts</button>
        </div>
      </Header>

      <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 16 }}>
        {/* 6 Pillar Cards */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 12 }}>
          {pillars.map((p) => (
            <Card key={p.id} onClick={() => go(p.id)} style={{ display: "flex", flexDirection: "column", gap: 8, cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontSize: 26 }}>{p.icon}</span>
                <div style={{ position: "relative", width: 44, height: 44 }}>
                  <Ring score={p.score} size={44} stroke={5} />
                  <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700 }}>{p.score}</div>
                </div>
              </div>
              <div style={{ fontWeight: 700, fontSize: 14 }}>{t(p.th, p.en)}</div>
            </Card>
          ))}
        </div>

        {/* Financial Tree button (leads to its own page) */}
        <Card onClick={onTree} style={{ cursor: "pointer", background: "linear-gradient(135deg, #E8F8EE, #F1FAF4)", border: `1px solid #B8E6C8` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ fontSize: 40 }}>🌳</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, color: T.navy, fontSize: 15 }}>{t("ต้นไม้การเงินของฉัน","My Financial Tree")}</div>
              <div style={{ fontSize: 12, color: T.sub }}>{t("ดูภาพรวมสุขภาพการเงินแบบต้นไม้","See your financial health as a growing tree")}</div>
            </div>
            <span style={{ fontSize: 20, color: T.good }}>→</span>
          </div>
        </Card>

        {/* Points bar */}
        <Card style={{ background: "linear-gradient(135deg, #FFF8E1, #FFF3CD)" }} onClick={onRewards}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
            <div>
              <div style={{ fontWeight: 700, color: T.navy, fontSize: 13 }}>⭐ {t("คะแนนสะสม","Reward Points")}</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: "#FFB800" }}>{fmt(points)} pts</div>
            </div>
            <div style={{ background: "#FFB800", color: "#fff", padding: "8px 14px", borderRadius: 10, fontSize: 13, fontWeight: 700 }}>{t("แลกรางวัล","Redeem")} →</div>
          </div>
        </Card>
      </div>
    </div>
  );
}

// ===== MAIN APP =====
function App() {
  const [page, setPage] = useState('feature');
  const [lang, setLang] = useState('th');
  LANG = lang; SET_LANG = setLang;
  const [stockBuyInfo, setStockBuyInfo] = useState({ ticker: null, price: null });
  const [fundInfo, setFundInfo] = useState(null);
  const [answers, setAnswers] = useState({
    occupation: null, income: 0, incomeType: null, maritalStatus: null, dependents: 0, ssfRmfAmount: 0, lifeInsurancePremium: 0, charitableDonation: 0,
    savings: 0, efStatus: null, investStatus: null, investFreq: null, investTypes: [], stockSectorsTH: [], stockSectorsINT: [], bondTypes: [], industries: [], insurance: [],
    hasDebt: null, debtTypes: [], debtBalance: 0, debtPayment: 0,
    goals: [], goalDetails: {},
    risk: null, wealthPref: null, lifestyle: [],
    expense: 0,
  });

  return (
    <div style={{ background: T.bg, minHeight: "100vh" }}>
      {page === 'feature' && <FeaturePage onStart={() => setPage('onboarding')} />}
      {page === 'onboarding' && <Onboarding answers={answers} setAnswers={setAnswers} onDone={() => setPage('allocation')} />}
      {page === 'allocation' && <WealthAllocationPage answers={answers} onNext={() => setPage('dashboard')} onBack={() => setPage('onboarding')} />}
      {page === 'dashboard' && <Dashboard answers={answers} go={setPage} onEdit={() => setPage('onboarding')} onRewards={() => setPage('rewards')} onTree={() => setPage('tree')} />}
      {page === 'tree' && <FinancialTreePage answers={answers} onBack={() => setPage('dashboard')} onRewards={() => setPage('rewards')} />}
      {page === 'rewards' && <RewardsPage answers={answers} onBack={() => setPage('dashboard')} />}
      {page === 'emergency' && <EmergencyFundPage answers={answers} onBack={() => setPage('dashboard')} />}
      {page === 'tax' && <TaxPlanningPage answers={answers} onBack={() => setPage('dashboard')} onBuyFund={(f) => { setFundInfo(f); setPage('ktxbuy'); }} onEducation={() => setPage('taxedu')} />}
      {page === 'ktxbuy' && <KTXBuyPage fund={fundInfo} answers={answers} onBack={() => setPage('tax')} />}
      {page === 'taxedu' && <TaxEducationPage onBack={() => setPage('tax')} />}
      {page === 'spending' && <DailySpendingPage answers={answers} onBack={() => setPage('dashboard')} />}
      {page === 'goals' && <SavingGoalsPage answers={answers} onBack={() => setPage('dashboard')} />}
      {page === 'invest' && <InvestmentPage answers={answers} onBack={() => setPage('dashboard')} onBuyStock={(ticker, price) => { setStockBuyInfo({ticker, price}); setPage('stockinfo'); }} />}
      {page === 'stockinfo' && <StockInfoPage ticker={stockBuyInfo.ticker} answers={answers} onBack={() => setPage('invest')} />}
      {page === 'insurance' && <InsurancePage answers={answers} onBack={() => setPage('dashboard')} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
