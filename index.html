// ===== PASSWORD PROTECTION =====
function PasswordGate({ onUnlock }) {
  const [pwd, setPwd] = useState("");
  const correctPwd = "krungthai2024"; // เปลี่ยนเป็นรหัสผ่านที่ต้องการ
  
  return (
    <div style={{
      position: "fixed", inset: 0, background: "linear-gradient(135deg, #00A6E6, #0077B3)",
      display: "flex", alignItems: "center", justifyContent: "center", zIndex: 9999,
    }}>
      <div style={{
        background: "white", borderRadius: 20, padding: 40, boxShadow: "0 20px 60px rgba(0,0,0,.2)",
        maxWidth: 400, width: "90%", textAlign: "center",
      }}>
        <h2 style={{ fontSize: 28, fontWeight: 800, color: "#0B2A4A", marginBottom: 10 }}>🔐 Access Required</h2>
        <p style={{ fontSize: 14, color: "#6B8299", marginBottom: 24 }}>Enter password to view 6 Financial Pillars</p>
        
        <input 
          type="password"
          value={pwd}
          onChange={(e) => setPwd(e.target.value)}
          onKeyPress={(e) => e.key === "Enter" && pwd === correctPwd && onUnlock()}
          placeholder="Enter password"
          style={{
            width: "100%", padding: "12px", fontSize: 16, borderRadius: 10,
            border: "1.5px solid #DCEAF3", marginBottom: 16, fontFamily: "inherit",
            boxSizing: "border-box",
          }}
        />
        
        <button 
          onClick={() => pwd === correctPwd && onUnlock()}
          disabled={pwd !== correctPwd}
          style={{
            width: "100%", padding: "12px", fontSize: 16, fontWeight: 700,
            background: pwd === correctPwd ? "#00A6E6" : "#DCEAF3",
            color: pwd === correctPwd ? "white" : "#6B8299",
            border: "none", borderRadius: 10, cursor: pwd === correctPwd ? "pointer" : "not-allowed",
            fontFamily: "inherit",
          }}
        >
          Unlock
        </button>
        
        {pwd && pwd !== correctPwd && (
          <p style={{ marginTop: 12, fontSize: 12, color: "#E5484D" }}>❌ Password incorrect</p>
        )}
      </div>
    </div>
  );
}

function Ring({ score, size = 64, stroke = 7 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const col = score >= 70 ? T.good : score >= 45 ? T.warn : T.bad;
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={T.line} strokeWidth={stroke} />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={col} strokeWidth={stroke}
        strokeLinecap="round" strokeDasharray={`${(score / 100) * c} ${c}`}
        style={{ transition: "stroke-dasharray .6s ease" }} />
    </svg>
  );
}

// ===== ANALYSIS FUNCTION =====
function analyze(a) {
  const occ = OCCUPATIONS.find((o) => o.id === a.occupation) || OCCUPATIONS[2];
  let efMonthsNeeded = occ.months;
  if (a.incomeType !== "Fixed Income") efMonthsNeeded = Math.min(12, efMonthsNeeded + 3);
  const efHave = EF_STATUS.find((s) => s.id === a.efStatus)?.months ?? 0;
  const efScore = Math.min(95, Math.round((efHave / efMonthsNeeded) * 100));

  const invBase = a.investStatus === "regular" ? 75 : a.investStatus === "some" ? 50 : 25;
  const invScore = Math.min(90, invBase + (a.investTypes.length >= 2 ? 10 : 0));

  const insCount = a.insurance.filter((i) => i !== "ไม่มี" && i !== "Others").length;
  let insScore = a.insurance.includes("ไม่มี") || insCount === 0 ? 20 : 30 + insCount * 20;
  if (a.hasDebt && a.debtTypes.includes("Home Loan") && !a.insurance.includes("Life Insurance"))
    insScore = Math.min(insScore, 55);
  insScore = Math.min(90, insScore);

  const dti = a.hasDebt && a.income > 0 ? (a.debtPayment / a.income) * 100 : 0;
  const spendScore = !a.hasDebt ? 78 : dti < 20 ? 68 : dti < 40 ? 48 : 28;

  const annual = a.income * 12;
  const taxable = annual > 310000;
  const taxScore = !taxable ? 75 : 55;

  const goalsScore = a.goals.length === 0 ? 30 : Math.min(85, 45 + a.goals.length * 10);

  const expense = a.expense || Math.round(a.income * 0.65);
  const overall = Math.round((efScore + invScore + insScore + spendScore + taxScore + goalsScore) / 6);
  return { occ, efMonthsNeeded, efHave, efScore, invScore, insScore, spendScore, taxScore, goalsScore, dti, taxable, annual, expense, overall };
}

// ===== INVESTMENT PAGE (AI-Powered via Gemini) =====
function InvestmentPage({ answers, onBack, onBuyStock }) {
  const [tab, setTab] = React.useState("news");
  const [newsItems, setNewsItems] = React.useState(null);
  const [newsLoading, setNewsLoading] = React.useState(false);
  const [chatMessages, setChatMessages] = React.useState([]);
  const [chatInput, setChatInput] = React.useState("");
  const [chatLoading, setChatLoading] = React.useState(false);
  const [initialized, setInitialized] = React.useState(false);

  // Gemini proxy helper
  async function callGemini({ systemInstruction, contents, temperature, maxOutputTokens }) {
    const resp = await fetch("/.netlify/functions/gemini-proxy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ systemInstruction, contents, temperature: temperature || 0.7, maxOutputTokens: maxOutputTokens || 1024 }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "API error");
    return data.text || "";
  }

  // Build user profile context
  const profileCtx = React.useMemo(() => {
    const A = analyze(answers);
    const inds = (answers.industries || []).join(", ") || "None selected";
    const types = (answers.investTypes || []).join(", ") || "None";
    const thSectors = (answers.stockSectorsTH || []).join(", ") || "None";
    const intSectors = (answers.stockSectorsINT || []).join(", ") || "None";
    return `User Financial Profile:
- Occupation: ${A.occ.label}, Monthly Income: ${fmt(answers.income || 0)} THB
- Investment Status: ${answers.investStatus || "never"}, Frequency: ${answers.investFreq || "N/A"}
- Risk Appetite: ${answers.risk || "moderate"}, Wealth Preference: ${answers.wealthPref || "N/A"}
- Interested Industries: ${inds}
- Investment Types: ${types}
- Thai Stock Sectors: ${thSectors}
- International Sectors: ${intSectors}
- Emergency Fund Score: ${A.efScore}/100
- Investment Score: ${A.invScore}/100
- Overall Financial Health: ${A.overall}/100`;
  }, [answers]);

  // Generate news on mount
  React.useEffect(() => {
    if (!initialized) { setInitialized(true); generateNews(); }
  }, []);

  async function generateNews() {
    setNewsLoading(true);
    try {
      const text = await callGemini({
        systemInstruction: "You are a financial news curator for a Thai banking app. Always return ONLY a valid JSON array. No markdown, no backticks, no explanation.",
        contents: [{ role: "user", parts: [{ text: `${profileCtx}

Based on this investor's profile, generate 5 personalized investment news/insight articles relevant to their interests, selected industries, sectors, and risk level. Return ONLY a valid JSON array:
[{"title":"...English title...","summary":"...one line Thai summary...","category":"...industry or sector tag...","sentiment":"positive|negative|neutral","ticker":"...relevant stock ticker or null..."}]

Rules:
- Match their selected industries and sectors closely
- If they picked FinTech, show FinTech news; if Healthcare, show Healthcare news
- Include a mix of Thai (SET) and international stocks
- Make titles specific and realistic
- Summaries in Thai, 1-2 sentences` }] }],
        temperature: 0.8,
        maxOutputTokens: 800,
      });
      const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
      setNewsItems(parsed);
    } catch (e) {
      console.error("News error:", e);
      setNewsItems([{ title: "Unable to load AI news", summary: "กรุณาลองใหม่อีกครั้ง — " + e.message, category: "System", sentiment: "neutral", ticker: null }]);
    }
    setNewsLoading(false);
  }

  // AI Chat system prompt
  const systemPrompt = `You are Krungthai Investment AI Assistant — an expert financial advisor in the Krungthai NEXT banking app.

${profileCtx}

CAPABILITIES & RULES:
1. Deep knowledge of investment fundamentals: asset allocation, diversification, risk management, DCA, value investing, growth investing, technical analysis, fundamental analysis.
2. You have access to KAsset Research Reports (mock data) and can provide:
   - Stock recommendations with target price ranges
   - Buy/Sell/Hold ratings with conviction levels
   - Optimal entry prices based on technical + fundamental analysis
   - Sector outlook and market commentary
3. When recommending stocks, ALWAYS format as:
   **[TICKER]** — [Company Name]
   Rating: [Buy/Sell/Hold]
   Current Price: [realistic mock price] THB
   Target Price: [range] THB
   Optimal Entry: [price] THB
   Source: KAsset Research Report

4. Thai stocks: use SET tickers (KBANK, SCB, ADVANC, CPALL, PTT, BH, BDMS, DELTA, AOT, SCC, GULF, OR, TRUE, MINT, CPN, BBL, KTB, PTTGC)
5. International: AAPL, MSFT, GOOGL, NVDA, AMZN, META, TSLA, etc.
6. Match recommendations to the user's risk appetite and interested sectors.
7. When user asks to buy a stock or you recommend buying, end your message with exactly: [[BUY:TICKER:PRICE]] (e.g. [[BUY:KBANK:142.50]]) — the app will render a buy button.
8. Respond primarily in Thai, use English for financial terms.
9. Keep responses concise and actionable.
10. Always end with disclaimer: "⚠️ ข้อมูลนี้เป็นการวิเคราะห์เบื้องต้น ไม่ใช่คำแนะนำการลงทุน ควรศึกษาข้อมูลเพิ่มเติมก่อนตัดสินใจ"`;

  async function sendChat(userMsg) {
    if (!userMsg.trim()) return;
    const newMsgs = [...chatMessages, { role: "user", content: userMsg }];
    setChatMessages(newMsgs);
    setChatInput("");
    setChatLoading(true);
    try {
      const contents = newMsgs.map((m) => ({
        role: m.role === "assistant" ? "model" : "user",
        parts: [{ text: m.content }],
      }));
      const aiText = await callGemini({ systemInstruction: systemPrompt, contents, temperature: 0.7, maxOutputTokens: 1024 });
      setChatMessages([...newMsgs, { role: "assistant", content: aiText }]);
    } catch (e) {
      setChatMessages([...newMsgs, { role: "assistant", content: "ขออภัย ไม่สามารถเชื่อมต่อได้: " + e.message }]);
    }
    setChatLoading(false);
  }

  // Parse [[BUY:TICKER:PRICE]] from AI response
  function renderAIMessage(text) {
    const buyMatches = [...text.matchAll(/\[\[BUY:([A-Z0-9.]+):([0-9.]+)\]\]/g)];
    const clean = text.replace(/\[\[BUY:[A-Z0-9.]+:[0-9.]+\]\]/g, "").trim();
    const lines = clean.split("\n");
    return (
      <div>
        {lines.map((line, i) => {
          if (line.startsWith("**") && line.includes("**")) {
            return <div key={i} style={{ fontWeight: 700, color: T.navy, marginTop: 6 }}>{line.replace(/\*\*/g, "")}</div>;
          }
          return <div key={i} style={{ fontSize: 13, lineHeight: 1.7, color: T.ink }}>{line}</div>;
        })}
        {buyMatches.map((m, i) => (
          <button key={i} onClick={() => onBuyStock && onBuyStock(m[1], parseFloat(m[2]))} style={{
            marginTop: 10, width: "100%", padding: 10, background: T.good, color: "#fff",
            border: "none", borderRadius: 8, fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
          }}>
            🛒 ซื้อ {m[1]} ที่ {fmt(parseFloat(m[2]))} THB →
          </button>
        ))}
      </div>

// ===== SMART WEALTH ALLOCATION (Step 2) =====
// Profile-driven engine: reads ALL assessment answers and predicts
// the person's priorities + income allocation + insights.
function buildPlan(a, A) {
  const income = a.income || 0;
  const deps = a.dependents || 0;
  const dt = a.debtTypes || [];
  const variableIncome = a.incomeType && a.incomeType !== "Fixed Income";
  const growthMinded = ["Wealth Growth", "Passive Income", "Financial Freedom"].includes(a.wealthPref);

  const goalObjs = (a.goals || [])
    .map((gid) => ({ g: GOALS.find((x) => x.id === gid), d: a.goalDetails[gid] || {} }))
    .filter((x) => x.g);
  const goalsByHorizon = [...goalObjs].sort((x, y) => (x.d.years || 99) - (y.d.years || 99));

  // ---------- URGENCY-RANKED PRIORITIES ----------
  const cand = [];

  // Emergency Fund
  let efU = 100 - A.efScore;
  if (variableIncome) efU += 10;
  if (deps > 0) efU += 5;
  cand.push({ label: A.efScore < 70 ? "Build Emergency Fund" : "Maintain Emergency Fund", urgency: efU });

  // Debt payoff (only if in debt)
  if (a.hasDebt) {
    let dU = A.dti >= 40 ? 92 : A.dti >= 20 ? 68 : 46;
    const highInterest = dt.includes("Credit Card");
    if (highInterest) dU += 15;
    cand.push({ label: highInterest ? "Pay Down High-Interest Debt" : "Reduce Debt Burden", urgency: dU });
  }

  // Goals (each, urgency from horizon + priority flag)
  goalObjs.forEach((go) => {
    const yrs = go.d.years || 99;
    let gU = yrs < 1 ? 84 : yrs <= 3 ? 68 : yrs <= 5 ? 54 : 40;
    if (go.d.priority === "High") gU += 10;
    else if (go.d.priority === "Low") gU -= 8;
    cand.push({ label: `Save for ${go.g.label} Fund`, urgency: gU, yrs });
  });

  // Investment (dampened if foundation weak)
  let invU = A.invScore < 50 ? 56 : 46;
  if (A.efScore < 50) invU -= 18;
  if (a.risk === "aggressive") invU += 12;
  else if (a.risk === "moderate") invU += 6;
  if (growthMinded) invU += 8;
  cand.push({ label: "Grow Investment Portfolio", urgency: invU });

  // Insurance / Protection
  let insU = 80 - A.insScore;
  if (deps > 0) insU += 15;
  if (a.maritalStatus === "Married") insU += 5;
  if (a.hasDebt && dt.includes("Home Loan") && !a.insurance.includes("Life Insurance")) insU += 15;
  cand.push({ label: "Build Financial Protection", urgency: insU });

  // Tax
  let taxU = A.annual > 750000 ? 66 : A.annual > 310000 ? 52 : 24;
  cand.push({ label: A.taxable ? "Optimize Tax Planning" : "Start Tax Planning", urgency: taxU });

  const priorities = cand
    .sort((x, y) => y.urgency - x.urgency || (x.yrs || 0) - (y.yrs || 0))
    .map((p) => ({ label: p.label, band: p.urgency >= 70 ? T.bad : p.urgency >= 45 ? T.warn : T.good }));

  // ---------- ALLOCATION (% of monthly income) ----------
  let emergency = A.efScore < 30 ? 22 : A.efScore < 60 ? 17 : A.efScore < 80 ? 12 : 6;
  if (variableIncome) emergency += 3;

  // Goals — derived from ACTUAL required monthly saving across their goals
  let goalNeed = 0;
  goalObjs.forEach((go) => { if (go.d.amount && go.d.years) goalNeed += go.d.amount / (go.d.years * 12); });
  let goals = 0;
  if (goalObjs.length > 0) {
    goals = income > 0 ? Math.min(28, (goalNeed / income) * 100) : 18;
    goals = Math.max(8, goals);
  }

  let investment = a.risk === "aggressive" ? 16 : a.risk === "conservative" ? 8 : 12;
  if (A.efScore < 50) investment = investment * 0.6;
  if (growthMinded) investment += 3;

  let insurance = A.insScore < 40 ? 9 : A.insScore < 70 ? 6 : 4;
  if (deps > 0) insurance += 2;
  if (a.hasDebt && dt.includes("Home Loan") && !a.insurance.includes("Life Insurance")) insurance += 2;

  let tax = A.annual > 750000 ? 8 : A.taxable ? 6 : 2;

  // Debt-service pressure pulls from discretionary buckets
  if (a.hasDebt && A.dti >= 30) {
    investment = Math.max(4, investment - 4);
    goals = goalObjs.length ? Math.max(6, goals - 3) : 0;
  }

  emergency = Math.round(emergency);
  goals = Math.round(goals);
  investment = Math.round(investment);
  insurance = Math.round(insurance);
  tax = Math.round(tax);

  let others = emergency + goals + investment + insurance + tax;
  let daily = 100 - others;
  if (daily < 30) {
    let over = 30 - daily;
    const trimG = Math.min(goals, over); goals -= trimG; over -= trimG;
    investment = Math.max(0, investment - over);
    daily = 30;
  }
  const alloc = { daily, emergency, goals, investment, insurance, tax };

  // ---------- INSIGHTS ----------
  const insights = [];
  if (A.efScore < 60) insights.push("ยังไม่มี Financial Foundation จาก Emergency Fund");
  else insights.push("มี Emergency Fund เป็น Financial Foundation ที่มั่นคงแล้ว");
  if (a.hasDebt && A.dti >= 30) insights.push(`ภาระหนี้ค่อนข้างสูง (DTI ${A.dti.toFixed(0)}%) ควรเร่งลดหนี้ก่อนขยายการลงทุน`);
  if (goalObjs.length >= 2) insights.push("มี Financial Goals หลายเป้าหมายที่ต้องบริหารพร้อมกัน");
  else if (goalObjs.length === 1) insights.push("มี Financial Goal ที่ชัดเจน 1 เป้าหมาย");
  if (goalsByHorizon.length >= 2) insights.push(`${goalsByHorizon[0].g.label} เป็น Goal ที่มี Time Horizon สั้นกว่า ${goalsByHorizon[goalsByHorizon.length - 1].g.label}`);
  const riskLabel = a.risk === "aggressive" ? "High" : a.risk === "conservative" ? "Conservative" : "Moderate";
  insights.push(`สามารถเริ่มสร้าง Wealth ผ่านการลงทุนได้ในระดับ ${riskLabel} Risk`);
  if (deps > 0) insights.push(`มีผู้พึ่งพา ${deps} คน — Financial Protection สำคัญกว่าคนทั่วไป`);
  if (A.insScore < 50) insights.push("ยังขาด Financial Protection ที่เพียงพอ");
  else insights.push("มี Financial Protection ในระดับที่เหมาะสม");
  if (A.taxable) insights.push("รายได้ถึงเกณฑ์เสียภาษี ควรวางแผนลดหย่อนอย่างจริงจัง");
  else insights.push("Tax Planning ยังไม่ใช่ Financial Priority ในปัจจุบัน แต่จะสำคัญมากขึ้นเมื่อรายได้เติบโต");

  return { priorities, alloc, insights };
}

            {priorities.map((p, i) => (
              <div key={i} style={{ display: "flex", gap: 10, alignItems: "center", padding: "11px 0", borderBottom: i < priorities.length - 1 ? `1px solid ${T.line}` : "none" }}>
                <span style={{ width: 8, height: 8, borderRadius: 4, background: p.band, flexShrink: 0 }} />
                <span style={{ fontSize: 13, fontWeight: 800, color: "#8C7B6E", minWidth: 20 }}>{String(i + 1).padStart(2, "0")}</span>
                <span style={{ fontSize: 14, color: T.ink, fontWeight: 600 }}>{p.label}</span>
              </div>
            ))}
          </div>
        </Card>

        <Card style={{ padding: 0, overflow: "hidden" }}>
          <div style={{ background: `linear-gradient(135deg, ${T.blue}, ${T.blueDark})`, color: "#fff", padding: "12px 16px", fontWeight: 700, fontSize: 15 }}>
            Recommended Allocation
          </div>
          <div style={{ padding: "8px 16px 0", fontSize: 12, color: T.sub }}>สัดส่วนของรายได้ต่อเดือน</div>
          <div style={{ padding: 16, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {allocCards.map((c) => (
              <div key={c.key} style={{ background: "#EAF3FB", borderRadius: 12, padding: "14px 10px", textAlign: "center" }}>
                <div style={{ fontSize: 12, color: T.sub, minHeight: 32, display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1.3 }}>{c.label}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: T.navy, marginTop: 4 }}>{range(c.v)}</div>
                {answers.income > 0 && (
                  <div style={{ fontSize: 11, color: T.blueDark, marginTop: 2 }}>≈ {fmt(answers.income * c.v / 100)} ฿</div>
                )}
              </div>
            ))}
          </div>
        </Card>

        <Card style={{ background: "#F4F1EE" }}>
          <div style={{ fontWeight: 700, color: T.navy, marginBottom: 10, fontSize: 14 }}>จาก Financial Profile ระบบพบว่า</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {insights.map((t, i) => (
              <div key={i} style={{ display: "flex", gap: 8, fontSize: 13, color: T.ink, lineHeight: 1.6 }}>
                <span style={{ color: T.blue, fontWeight: 700 }}>•</span>
                <span>{t}</span>
              </div>
            ))}
          </div>
        </Card>

        <button onClick={onNext} style={{
          padding: "14px 0", borderRadius: 12, border: "none",
          background: T.blue, color: "#fff", fontSize: 15, fontWeight: 700,
          cursor: "pointer", fontFamily: "inherit",
        }}>ดู Dashboard →</button>
      </div>
    </div>
  );
}

// ===== DASHBOARD =====
function Dashboard({ answers, go, onEdit }) {
  const A = analyze(answers);
  const pillars = [
    { id: "emergency", en: "Emergency Fund", icon: "🛟", score: A.efScore },
    { id: "tax", en: "Tax Planning", icon: "🧾", score: A.taxScore },
    { id: "spending", en: "Daily Spending", icon: "💳", score: A.spendScore },
    { id: "goals", en: "Saving Goals", icon: "🎯", score: A.goalsScore },
    { id: "invest", en: "Investment", icon: "📈", score: A.invScore },
    { id: "insurance", en: "Insurance", icon: "🛡️", score: A.insScore },
  ];
  const weakest = [...pillars].sort((x, y) => x.score - y.score).slice(0, 2);

  return (
    <div className="app-container">
      <Header title="6 Financial Pillars" sub={`${A.occ.label} · ${fmt(answers.income)} บาท/เดือน`}>
        <div style={{ marginTop: 16, display: "flex", alignItems: "center", gap: 16, background: "rgba(255,255,255,.14)", borderRadius: 16, padding: 14 }}>
          <div style={{ position: "relative", width: 72, height: 72 }}>
            <Ring score={A.overall} size={72} stroke={8} />
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, fontWeight: 800 }}>{A.overall}</div>
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 15, fontWeight: 700 }}>Financial Health</div>
            <div style={{ fontSize: 12, opacity: 0.85, marginTop: 2 }}>Focus: {weakest.map(w => w.en).join(" + ")}</div>
            <button onClick={onEdit} style={{ marginTop: 6, background: "rgba(255,255,255,.18)", color: "#fff", border: "none", borderRadius: 8, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>✏️ Edit</button>
          </div>
        </div>
      </Header>
      <div style={{ padding: 20 }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 12 }}>
          {pillars.map((p) => (
            <Card key={p.id} onClick={() => go(p.id)} style={{ display: "flex", flexDirection: "column", gap: 8, cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontSize: 26 }}>{p.icon}</span>
                <div style={{ position: "relative", width: 44, height: 44 }}>
                  <Ring score={p.score} size={44} stroke={5} />
                  <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700 }}>{p.score}</div>
                </div>
              </div>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{p.en}</div>
              </div>
            </Card>
          ))}
        </div>
      </div>
    </div>
  );
}

// ===== MAIN APP =====
function App() {
  const [unlocked, setUnlocked] = useState(false);
  const [page, setPage] = useState('feature');
  const [stockBuyInfo, setStockBuyInfo] = useState({ ticker: null, price: null });
  const [answers, setAnswers] = useState({
    occupation: null, income: 0, incomeType: null, maritalStatus: null, dependents: 0, ssfRmfAmount: 0, lifeInsurancePremium: 0, charitableDonation: 0,
    savings: 0, efStatus: null, investStatus: null, investFreq: null, investTypes: [], stockSectorsTH: [], stockSectorsINT: [], bondTypes: [], industries: [], insurance: [],
    hasDebt: null, debtTypes: [], debtBalance: 0, debtPayment: 0,
    goals: [], goalDetails: {},
    risk: null, wealthPref: null, lifestyle: [],
    expense: 0,
  });

  if (!unlocked) return <PasswordGate onUnlock={() => setUnlocked(true)} />;

  return (
    <div style={{ background: T.bg, minHeight: "100vh" }}>
      {page === 'feature' && <FeaturePage onStart={() => setPage('onboarding')} />}
      {page === 'onboarding' && <Onboarding answers={answers} setAnswers={setAnswers} onDone={() => setPage('allocation')} />}
      {page === 'allocation' && <WealthAllocationPage answers={answers} onNext={() => setPage('dashboard')} onBack={() => setPage('onboarding')} />}
      {page === 'dashboard' && <Dashboard answers={answers} go={setPage} onEdit={() => setPage('onboarding')} />}
      {page === 'emergency' && <EmergencyFundPage answers={answers} onBack={() => setPage('dashboard')} />}
      {page === 'tax' && <TaxPlanningPage answers={answers} onBack={() => setPage('dashboard')} />}
      {page === 'spending' && <DailySpendingPage answers={answers} onBack={() => setPage('dashboard')} />}
      {page === 'goals' && <SavingGoalsPage answers={answers} onBack={() => setPage('dashboard')} />}
      {page === 'invest' && <InvestmentPage answers={answers} onBack={() => setPage('dashboard')} onBuyStock={(ticker, price) => { setStockBuyInfo({ticker, price}); setPage('stockbuy'); }} />}
      {page === 'stockbuy' && <StockBuyPage ticker={stockBuyInfo.ticker} price={stockBuyInfo.price} answers={answers} onBack={() => setPage('invest')} />}
      {page === 'insurance' && <InsurancePage answers={answers} onBack={() => setPage('dashboard')} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
